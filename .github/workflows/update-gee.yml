name: Perbarui data GEE

on:
  workflow_dispatch:            # tombol "Run workflow" manual
  schedule:
    - cron: "0 22 * * *"        # otomatis tiap Senin 06:00 WIB (Minggu 23:00 UTC)

permissions:
  contents: write               # izin commit hasil ke repo

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install earthengine-api

      - name: Tulis kunci service account ke file sementara
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: printf '%s' "$GEE_SERVICE_ACCOUNT_KEY" > "$RUNNER_TEMP/gee-key.json"

      - name: Jalankan skrip GEE
        env:
          GEE_PROJECT: ${{ secrets.GEE_PROJECT }}
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gee-key.json
        run: python gee/update_gee.py

      - name: Commit hasil jika ada perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gee_*.json
          git diff --staged --quiet || git commit -m "Perbarui data GEE otomatis"
          git push
